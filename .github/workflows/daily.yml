name: Daily production scrape

on:
  schedule:
    # 7am Arizona (MST, UTC-7). Arizona does not observe DST and GitHub cron is
    # always UTC, so unlike most US timezones this stays at 7am all year.
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scrape only; write no Sheet and send no email'
        type: boolean
        default: false
      sample:
        description: 'Limit to N organizations (0 = all). A real end-to-end run, just small.'
        type: string
        default: '0'
      trw_pages:
        description: 'Limit TRW to N show pages (0 = all 381, ~13 min)'
        type: string
        default: '0'
  push:
    # Committing a change to this one file requests a run. This exists because
    # automation without `actions: write` cannot dispatch a workflow, but can
    # push a commit -- and it leaves a record in git of why each ad-hoc run
    # happened. Scoped to the single path, so ordinary code pushes never
    # trigger a run.
    paths:
      - '.github/run-request.json'

# Never let a slow run overlap the next day's.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run parser tests
        # Cheap guard: if a licensor changed their markup, fail here rather
        # than overwriting the sheet with garbage.
        run: |
          pip install pytest
          python -m pytest tests/ -q

      - name: Resolve run parameters
        id: params
        env:
          # Interpolated into the environment, never into the script body.
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_SAMPLE: ${{ inputs.sample }}
          INPUT_TRW_PAGES: ${{ inputs.trw_pages }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -f .github/run-request.json ]; then
            DRY_RUN=$(jq -r '.dry_run // false' .github/run-request.json)
            SAMPLE=$(jq -r '.sample // 0' .github/run-request.json)
            TRW_PAGES=$(jq -r '.trw_pages // 0' .github/run-request.json)
            echo "source: .github/run-request.json"
            jq -r '.note // "(no note)"' .github/run-request.json
          else
            # Dispatch inputs, or -- on the 7am schedule, where inputs are
            # empty -- the defaults, which mean a full production run.
            DRY_RUN="${INPUT_DRY_RUN:-false}"
            SAMPLE="${INPUT_SAMPLE:-0}"
            TRW_PAGES="${INPUT_TRW_PAGES:-0}"
            echo "source: ${GITHUB_EVENT_NAME} (${DRY_RUN}/${SAMPLE}/${TRW_PAGES})"
          fi
          {
            echo "dry_run=${DRY_RUN}"
            echo "sample=${SAMPLE}"
            echo "trw_pages=${TRW_PAGES}"
          } >> "$GITHUB_OUTPUT"

      - name: Scrape and publish
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          # Passed through the environment rather than interpolated into the
          # script, so a value can never be spliced into the shell command.
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
          SAMPLE: ${{ steps.params.outputs.sample }}
          TRW_PAGES: ${{ steps.params.outputs.trw_pages }}
        # Steps run under `bash -e`, so a bare `[ test ] && assign` would abort
        # the step whenever the test is false. Use explicit ifs.
        run: |
          ARGS=""
          if [ "${DRY_RUN}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${SAMPLE}" ] && [ "${SAMPLE}" != "0" ]; then
            ARGS="$ARGS --sample ${SAMPLE}"
          fi
          if [ -n "${TRW_PAGES}" ] && [ "${TRW_PAGES}" != "0" ]; then
            ARGS="$ARGS --trw-pages ${TRW_PAGES}"
          fi
          echo "running: python main.py$ARGS"
          python main.py $ARGS

      - name: Commit state
        # seen.json is what makes "new today" meaningful tomorrow; org_cache
        # is what stops the same organization being re-scraped every morning.
        if: ${{ steps.params.outputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --staged --quiet; then
            echo "no state changes"
          else
            git commit -m "chore: update scrape state $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload preview on dry run
        if: ${{ steps.params.outputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: out/preview.csv
          if-no-files-found: ignore
