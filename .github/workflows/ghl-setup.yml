name: GHL setup

# Creates the pipeline and custom fields in GoHighLevel, using the repo's own
# GHL_API_KEY secret -- so the key is never shared or pasted anywhere.
#
# Defaults to a dry run: it reports what exists and what is missing and creates
# nothing. Set apply=true to actually create.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Actually create the pipeline and fields (otherwise dry run)'
        type: boolean
        default: false
  push:
    # Same request-file trick as the daily run, since dispatching a workflow
    # needs a permission this repo's automation does not have.
    paths:
      - '.github/ghl-setup-request.json'

permissions:
  # The purge commits the contact backup and the suppression list.
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Create pipeline and custom fields
        env:
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          INPUT_APPLY: ${{ inputs.apply }}
        run: |
          APPLY="${INPUT_APPLY:-false}"
          INSPECT=""
          PURGE=""
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -f .github/ghl-setup-request.json ]; then
            APPLY=$(jq -r '.apply // false' .github/ghl-setup-request.json)
            INSPECT=$(jq -r '.inspect // ""' .github/ghl-setup-request.json)
            PURGE=$(jq -r '.purge // ""' .github/ghl-setup-request.json)
          fi
          # Inspect wins over apply: it is a read-only diagnostic and should
          # never be able to create anything as a side effect.
          if [ "${PURGE}" = "dry" ]; then
            # Reports and writes the backup. Deletes nothing.
            python purge_ghl.py
          elif [ "${PURGE}" = "apply" ]; then
            # Irreversible. Aborts by itself if the backup is incomplete.
            python purge_ghl.py --apply
          elif [ -n "${INSPECT}" ]; then
            python setup_ghl.py --inspect "${INSPECT}"
          elif [ "${APPLY}" = "true" ]; then
            python setup_ghl.py --apply
          else
            python setup_ghl.py
          fi

      - name: Commit backup and suppression list
        # The contact backup is the only way back from a delete, and the
        # suppression list is what stops the next morning's ingest re-creating
        # everything that was just removed. Both are worthless uncommitted.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --staged --quiet; then
            echo "no state changes"
            exit 0
          fi
          git commit -m "chore: GHL purge state $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "state pushed on attempt ${attempt}"
              exit 0
            fi
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" -X ours || {
              git rebase --abort || true
              git reset --soft "origin/${GITHUB_REF_NAME}"
              git add state/
              git commit -m "chore: GHL purge state $(date -u +%Y-%m-%d)" || true
            }
            sleep $(( attempt * 3 ))
          done
          echo "::error::could not push purge state after 5 attempts"
          exit 1
